apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelproviders.aiops.platform
spec:
  group: aiops.platform
  scope: Namespaced
  names:
    plural: modelproviders
    singular: modelprovider
    kind: ModelProvider
    shortNames:
      - mprov
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["provider"]
              properties:
                provider:
                  type: string
                model:
                  type: string
                endpoint:
                  type: string
                apiKeySecretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                timeout:
                  type: string
                maxTokens:
                  type: integer
                dataPolicy:
                  type: object
                  properties:
                    allowExternalTransmission:
                      type: boolean
                    allowedEvidenceKinds:
                      type: array
                      items:
                        type: string
                    deniedSensitivityTags:
                      type: array
                      items:
                        type: string
                    allowLogSamples:
                      type: boolean
                    requireRedaction:
                      type: boolean
                    maximumClassification:
                      type: string
                fallbackProviderRef:
                  type: object
                  properties:
                    name:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                updatedAt:
                  type: string
                  format: date-time
      subresources:
        status: {}
