name: FluxAgent Codex RCA

on:
  workflow_dispatch:
    inputs:
      risk_signal_namespace:
        description: "Namespace containing the RiskSignal"
        required: true
        default: "fluxagent-test"
        type: string
      risk_signal_name:
        description: "RiskSignal name to analyze"
        required: true
        type: string
      cluster_context:
        description: "kubectl context available on the persistent runner"
        required: true
        default: "admin@homelab-test"
        type: string
      create_issue:
        description: "Create a GitHub issue with the analysis"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: fluxagent-codex-rca-${{ inputs.risk_signal_namespace }}-${{ inputs.risk_signal_name }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze RCA With Subscription Codex
    runs-on: [self-hosted, Linux, X64, fluxagent-codex-subscription]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for tool in kubectl codex; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required tool on persistent runner: $tool" >&2
              exit 1
            fi
          done
          codex --version
          kubectl --context "${{ inputs.cluster_context }}" version --client=true

      - name: Collect FluxAgent RCA evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/codex-rca
          ns="${{ inputs.risk_signal_namespace }}"
          name="${{ inputs.risk_signal_name }}"
          context="${{ inputs.cluster_context }}"

          kubectl --context "$context" get risksignal "$name" -n "$ns" -o yaml > dist/codex-rca/risksignal.yaml
          kubectl --context "$context" get risksignal "$name" -n "$ns" -o json > dist/codex-rca/risksignal.json

          target_ns="$(kubectl --context "$context" get risksignal "$name" -n "$ns" -o jsonpath='{.spec.target.namespace}')"
          target_kind="$(kubectl --context "$context" get risksignal "$name" -n "$ns" -o jsonpath='{.spec.target.kind}')"
          target_name="$(kubectl --context "$context" get risksignal "$name" -n "$ns" -o jsonpath='{.spec.target.name}')"
          if [ -n "$target_ns" ] && [ -n "$target_kind" ] && [ -n "$target_name" ]; then
            {
              echo "# Target"
              echo "$target_kind $target_ns/$target_name"
              echo
              kubectl --context "$context" get "$target_kind" "$target_name" -n "$target_ns" -o yaml || true
              echo
              echo "# Describe"
              kubectl --context "$context" describe "$target_kind" "$target_name" -n "$target_ns" || true
              echo
              echo "# Recent namespace events"
              kubectl --context "$context" get events -n "$target_ns" --sort-by=.lastTimestamp | tail -80 || true
            } > dist/codex-rca/target-context.txt
          else
            echo "RiskSignal does not include complete target reference." > dist/codex-rca/target-context.txt
          fi

          cat > dist/codex-rca/prompt.md <<'EOF'
          You are a read-only SRE investigator analyzing FluxAgent RCA output.

          Inputs:
          - dist/codex-rca/risksignal.yaml
          - dist/codex-rca/target-context.txt
          - this repository checkout

          Constraints:
          - Do not modify files.
          - Do not run commands that mutate Kubernetes or external systems.
          - Do not request or print secrets.
          - Ground every conclusion in the provided RiskSignal, Kubernetes context, or repository files.

          Produce Markdown with:
          - Executive summary
          - Likely root cause
          - Evidence used
          - Contradicting or missing evidence
          - Validation steps
          - Safe remediation proposal
          - Whether a PR is recommended
          EOF

          {
            echo "risk_signal_namespace=$ns"
            echo "risk_signal_name=$name"
            echo "target_namespace=$target_ns"
            echo "target_kind=$target_kind"
            echo "target_name=$target_name"
          } >> "$GITHUB_OUTPUT"

      - name: Run Codex CLI analysis
        shell: bash
        run: |
          set -euo pipefail
          codex exec "$(cat dist/codex-rca/prompt.md)" > dist/codex-rca/codex-analysis.md
          test -s dist/codex-rca/codex-analysis.md

      - name: Write summary
        shell: bash
        run: |
          {
            echo "### FluxAgent Codex RCA"
            echo "- RiskSignal: ${{ inputs.risk_signal_namespace }}/${{ inputs.risk_signal_name }}"
            echo "- Cluster context: ${{ inputs.cluster_context }}"
            echo "- Target: ${{ steps.evidence.outputs.target_kind }} ${{ steps.evidence.outputs.target_namespace }}/${{ steps.evidence.outputs.target_name }}"
            echo
            cat dist/codex-rca/codex-analysis.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxagent-codex-rca-${{ inputs.risk_signal_namespace }}-${{ inputs.risk_signal_name }}
          path: dist/codex-rca/

      - name: Create issue
        if: inputs.create_issue
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("dist/codex-rca/codex-analysis.md", "utf8");
            const title = `FluxAgent RCA analysis: ${{ inputs.risk_signal_namespace }}/${{ inputs.risk_signal_name }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `RiskSignal: \`${{ inputs.risk_signal_namespace }}/${{ inputs.risk_signal_name }}\``,
                `Cluster context: \`${{ inputs.cluster_context }}\``,
                "",
                body,
              ].join("\n"),
            });
