apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxagent-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluxagent-observability
  template:
    metadata:
      labels:
        app: fluxagent-observability
    spec:
      containers:
        - name: observability
          image: fluxagent/demo-observability:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: fluxagent-observability
spec:
  selector:
    app: fluxagent-observability
  ports:
    - name: http
      port: 8080
      targetPort: 8080
