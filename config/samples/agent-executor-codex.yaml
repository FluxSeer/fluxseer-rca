apiVersion: aiops.platform/v1alpha1
kind: AgentExecutor
metadata:
  name: codex-cli
spec:
  type: codex-cli
  image: fluxagent/agent-executor-codex:dev
  command:
    - /fluxagent-agent-executor
  args:
    - --type=codex-cli
    - --command=codex
    - --arg=exec
    - --arg=--json
    - --prompt-arg
  credentialEnvName: CODEX_API_KEY
  credentialSecretRef:
    name: codex-secret
    key: api-key
  serviceAccountName: fluxagent-investigator
  timeoutSeconds: 900
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  maxToolCalls: 40
