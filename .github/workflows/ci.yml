name: FluxAgent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "charts/**"
      - "cmd/**"
      - "config/**"
      - "docs/**"
      - "examples/**"
      - "hack/**"
      - "internal/**"
      - "test/**"
      - "Dockerfile"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluxagent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: v0.2.0-beta.1
  TARGET_PLATFORM: linux/amd64

jobs:
  verify:
    name: Verify Source And Packaging
    runs-on: [self-hosted, Linux, X64, fluxagent-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Verify v0.2 alpha gate
        run: make verify-v0.2-alpha

      - name: Verify packaging consistency
        run: |
          make verify-packaging-consistency \
            VERSION="${RELEASE_VERSION}" \
            IMAGE_TAG="ci-${GITHUB_SHA}" \
            TARGET_PLATFORM="${TARGET_PLATFORM}" \
            IMAGE_REPOSITORY="fluxagent/operator" \
            DEMO_IMAGE_REPOSITORY="fluxagent/demo-observability"

      - name: Helm lint
        run: helm lint charts/kube-ai-sre

  image-identity:
    name: Verify Image Identity
    runs-on: [self-hosted, Linux, X64, fluxagent-test]
    needs: [verify]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify artifact identity
        run: |
          make verify-artifact-identity \
            VERSION="${RELEASE_VERSION}" \
            IMAGE_TAG="ci-${GITHUB_SHA}" \
            TARGET_PLATFORM="${TARGET_PLATFORM}" \
            IMAGE_REPOSITORY="fluxagent/operator" \
            DEMO_IMAGE_REPOSITORY="fluxagent/demo-observability"

      - name: Write summary
        run: |
          {
            echo "### FluxAgent CI"
            echo "- Version input: ${RELEASE_VERSION}"
            echo "- Target platform: ${TARGET_PLATFORM}"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
