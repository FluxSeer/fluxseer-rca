apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluxagent-manager-role
rules:
  - apiGroups: [""]
    resources: ["events", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["aiops.platform"]
    resources: ["agentexecutors", "datasources", "investigationrequests", "modelproviders", "riskrules"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aiops.platform"]
    resources: ["agentanalysisresults", "risksignals", "remediationplans", "agentactions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["aiops.platform"]
    resources: ["agentanalysisresults/status", "agentexecutors/status", "datasources/status", "investigationrequests/status", "modelproviders/status", "riskrules/status", "risksignals/status", "remediationplans/status", "agentactions/status"]
    verbs: ["get", "update", "patch"]
