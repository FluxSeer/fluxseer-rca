apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentexecutors.aiops.platform
spec:
  group: aiops.platform
  scope: Namespaced
  names:
    plural: agentexecutors
    singular: agentexecutor
    kind: AgentExecutor
    shortNames:
      - aexec
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["type", "image"]
              properties:
                type:
                  type: string
                  enum:
                    - codex-cli
                    - claude-cli
                    - gemini-cli
                image:
                  type: string
                command:
                  type: array
                  items:
                    type: string
                args:
                  type: array
                  items:
                    type: string
                imagePullSecrets:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                credentialEnvName:
                  type: string
                credentialSecretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                serviceAccountName:
                  type: string
                timeoutSeconds:
                  type: integer
                  format: int64
                backoffLimit:
                  type: integer
                  format: int32
                ttlSecondsAfterFinished:
                  type: integer
                  format: int32
                maxToolCalls:
                  type: integer
                  format: int32
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                updatedAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
