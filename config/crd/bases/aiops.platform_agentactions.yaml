apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentactions.aiops.platform
spec:
  group: aiops.platform
  scope: Namespaced
  names:
    plural: agentactions
    singular: agentaction
    kind: AgentAction
    shortNames:
      - aact
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["target", "actionType"]
              properties:
                target:
                  type: object
                  properties:
                    cluster: {type: string}
                    namespace: {type: string}
                    kind: {type: string}
                    name: {type: string}
                    apiVersion: {type: string}
                    service: {type: string}
                actionType: {type: string}
                parameters:
                  type: object
                  additionalProperties:
                    type: string
                approvedBy: {type: string}
                dryRunResult: {type: string}
                ttlSeconds: {type: integer, format: int64}
                approvalTimeoutSeconds: {type: integer, format: int64}
                rollbackPlan:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                observedGeneration: {type: integer, format: int64}
                updatedAt: {type: string, format: date-time}
                finishedAt: {type: string, format: date-time}
                approval:
                  type: object
                  properties:
                    approved: {type: boolean}
                    approvedBy: {type: string}
                    source: {type: string}
                    actionDigest: {type: string}
                    approvedGeneration: {type: integer, format: int64}
                    approvedAt: {type: string, format: date-time}
                    escalatedAt: {type: string, format: date-time}
                    decidedAt: {type: string, format: date-time}
                    decidedBy: {type: string}
                notification:
                  type: object
                  properties:
                    lastAttemptAt: {type: string, format: date-time}
                    retryCount: {type: integer, format: int32}
                    lastError: {type: string}
                dryRunResult:
                  type: object
                  properties:
                    result: {type: string}
                    recordedAt: {type: string, format: date-time}
                execution:
                  type: object
                  properties:
                    phase: {type: string}
                    outcome: {type: string}
                    executionID: {type: string}
                    idempotencyKey: {type: string}
                    attempt: {type: integer, format: int32}
                    failureReason: {type: string}
                    executor: {type: string}
                    summary: {type: string}
                    startedAt: {type: string, format: date-time}
                    finishedAt: {type: string, format: date-time}
                    externalRef: {type: string}
                    retryable: {type: boolean}
                effectiveness:
                  type: object
                  properties:
                    phase: {type: string}
                    outcome: {type: string}
                    message: {type: string}
                    startedAt: {type: string, format: date-time}
                    finishedAt: {type: string, format: date-time}
                    settlingUntil: {type: string, format: date-time}
                    observationUntil: {type: string, format: date-time}
                    verificationRef:
                      type: object
                      properties:
                        name: {type: string}
                        namespace: {type: string}
                    baseline:
                      type: object
                      required: ["target"]
                      properties:
                        capturedAt: {type: string, format: date-time}
                        target:
                          type: object
                          properties:
                            cluster: {type: string}
                            namespace: {type: string}
                            kind: {type: string}
                            name: {type: string}
                            apiVersion: {type: string}
                            service: {type: string}
                        targetUID: {type: string}
                        riskSignalRef:
                          type: object
                          properties:
                            name: {type: string}
                            namespace: {type: string}
                        evidenceRefs:
                          type: array
                          items:
                            type: object
                            properties:
                              id: {type: string}
                              kind: {type: string}
                              source: {type: string}
                              summary: {type: string}
                              link: {type: string}
                        digest: {type: string}
                        unavailableReason: {type: string}
                        health:
                          type: object
                          properties:
                            generation: {type: integer, format: int64}
                            observedGeneration: {type: integer, format: int64}
                            desiredReplicas: {type: integer, format: int32}
                            updatedReplicas: {type: integer, format: int32}
                            availableReplicas: {type: integer, format: int32}
                            readyReplicas: {type: integer, format: int32}
                            conditions:
                              type: array
                              items:
                                type: object
                                properties:
                                  type: {type: string}
                                  status: {type: string}
                                  reason: {type: string}
                                  message: {type: string}
      subresources:
        status: {}
