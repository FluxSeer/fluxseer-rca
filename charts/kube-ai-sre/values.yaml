image:
  repository: fluxagent/operator
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: fluxagent-controller-manager

controller:
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  enableLeaderElection: false
  enableRemediation: false
  enableAgentAnalysis: false
  extraArgs: []
  extraEnv: []
  resources: {}

agentAnalysis:
  investigatorServiceAccount:
    create: true
    name: fluxagent-investigator
    imagePullSecrets: []

modelGateway:
  provider: heuristic

dataSources:
  prometheus:
    enabled: false
    url: ""
  loki:
    enabled: false
    url: ""

notification:
  slackWebhookSecretRef: ""
