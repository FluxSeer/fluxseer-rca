apiVersion: aiops.platform/v1alpha1
kind: AgentExecutor
metadata:
  name: claude-cli
spec:
  type: claude-cli
  image: fluxagent/agent-executor-claude:dev
  imagePullSecrets: []
  command:
    - /fluxagent-agent-executor
  args:
    - --type=claude-cli
    - --command=claude
    - --arg=-p
    - --arg=--output-format
    - --arg=json
    - --prompt-arg
  credentialEnvName: ANTHROPIC_API_KEY
  credentialSecretRef:
    name: claude-secret
    key: api-key
  serviceAccountName: fluxagent-investigator
  timeoutSeconds: 900
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  maxToolCalls: 40
