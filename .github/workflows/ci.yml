name: FluxSeer RCA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".agents/**"
      - "AGENTS.md"
      - "charts/**"
      - "cmd/**"
      - "config/**"
      - "docs/**"
      - "examples/**"
      - "hack/**"
      - "internal/**"
      - "test/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "Dockerfile"
      - "Makefile"
      - "README.md"
      - "go.mod"
      - "go.sum"
      - ".github/ISSUE_TEMPLATE.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluxseer-rca-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: v0.4.0-beta.3
  TARGET_PLATFORM: linux/amd64

jobs:
  engineering-baseline:
    name: Validate Engineering Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install skill validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate Skill metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path(".agents/skills/engineering-baseline/SKILL.md")
          text = path.read_text(encoding="utf-8")
          if not text.startswith("---\n"):
              raise SystemExit("SKILL.md is missing YAML frontmatter")
          _, frontmatter, _ = text.split("---\n", 2)
          metadata = yaml.safe_load(frontmatter)
          if metadata.get("name") != "engineering-baseline":
              raise SystemExit("unexpected Skill name")
          if not metadata.get("description", "").strip():
              raise SystemExit("Skill description is empty")
          print("Skill metadata: PASS")
          PY

      - name: Run repository regression for the qualifier
        run: GOWORK=off go test ./...

      - name: Validate golden corpus and prepared report
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/engineering-baseline-prepared.json"
          GOWORK=off go run ./cmd/engineering-baseline-eval \
            --cases test/skill/engineering-baseline-evals.yaml \
            --output "$report"
          python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)
          summary = report["summary"]
          cases = report["cases"]
          assert report["status"] == "PREPARED"
          assert report["executionStatus"] == "PREPARED"
          assert summary["overall"] == "PREPARED"
          assert summary["cases"] == 13
          assert summary["executed"] == 0
          assert len(cases) == 13
          assert sum(case["critical"] for case in cases) == 4
          print("Deterministic gate: PASS")
          print("Golden corpus: 13 cases, 4 critical")
          print("Hosted GitHub execution: PENDING until this workflow completes")
          print("Behavioral enforcement: REPORT_ONLY")
          print("Engineering qualification: NOT QUALIFIED")
          PY

      - name: Upload prepared qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-baseline-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/engineering-baseline-prepared.json
          if-no-files-found: ignore

  verify:
    name: Verify Source And Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tool in make jq; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing+=("$tool")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""
            if command -v sudo >/dev/null 2>&1; then
              sudo_cmd="sudo"
            fi
            $sudo_cmd apt-get update
            $sudo_cmd apt-get install -y "${missing[@]}"
          else
            echo "Missing required tools: ${missing[*]}" >&2
            echo "Install them in the self-hosted runner image or add an installer for this OS." >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Verify v0.3 beta hardening gate
        run: make verify-v0.3-beta-hardening

      - name: Verify v0.4 approval lifecycle gate
        run: make verify-v0.4-approval-lifecycle

      - name: Verify packaging consistency
        run: |
          make verify-packaging-consistency \
            VERSION="${RELEASE_VERSION}" \
            IMAGE_TAG="ci-${GITHUB_SHA}" \
            TARGET_PLATFORM="${TARGET_PLATFORM}" \
            IMAGE_REPOSITORY="fluxseer/fluxseer-rca/operator" \
            DEMO_IMAGE_REPOSITORY="fluxseer/fluxseer-rca/demo-observability"

      - name: Verify rule packs
        run: make verify-rule-packs

      - name: Verify detection catalog and documentation contract
        run: |
          make verify-detection-pattern-catalog
          make verify-traffic-pattern-promql
          make verify-prometheus-pattern-promql
          make verify-docs-contract

      - name: Helm lint
        run: helm lint charts/fluxseer-rca

  image-identity:
    name: Verify Image Identity
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tool in make jq; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing+=("$tool")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""
            if command -v sudo >/dev/null 2>&1; then
              sudo_cmd="sudo"
            fi
            $sudo_cmd apt-get update
            $sudo_cmd apt-get install -y "${missing[@]}"
          else
            echo "Missing required tools: ${missing[*]}" >&2
            echo "Install them in the self-hosted runner image or add an installer for this OS." >&2
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify artifact identity
        run: |
          make verify-artifact-identity \
            VERSION="${RELEASE_VERSION}" \
            IMAGE_TAG="ci-${GITHUB_SHA}" \
            TARGET_PLATFORM="${TARGET_PLATFORM}" \
            IMAGE_REPOSITORY="fluxseer/fluxseer-rca/operator" \
            DEMO_IMAGE_REPOSITORY="fluxseer/fluxseer-rca/demo-observability"

      - name: Write summary
        run: |
          {
            echo "### FluxSeer RCA CI"
            echo "- Version input: ${RELEASE_VERSION}"
            echo "- Target platform: ${TARGET_PLATFORM}"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-test-image:
    name: Publish Test Artifacts
    runs-on: ubuntu-latest
    needs: [verify, image-identity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    env:
      HARBOR_PROJECT: fluxseer
      HARBOR_REPOSITORY_PREFIX: fluxseer-rca
      CHART_NAME: fluxseer-rca
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tool in make; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing+=("$tool")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""
            if command -v sudo >/dev/null 2>&1; then
              sudo_cmd="sudo"
            fi
            $sudo_cmd apt-get update
            $sudo_cmd apt-get install -y "${missing[@]}"
          else
            echo "Missing required tools: ${missing[*]}" >&2
            echo "Install them in the self-hosted runner image or add an installer for this OS." >&2
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Resolve test artifact metadata
        id: meta
        shell: bash
        env:
          SECRET_REGISTRY: ${{ secrets.CI_HARBOR_REGISTRY }}
          SECRET_USER: ${{ secrets.CI_HARBOR_GHA_USER }}
          SECRET_TOKEN: ${{ secrets.CI_HARBOR_GHA_TOKEN }}
        run: |
          set -euo pipefail
          registry="${SECRET_REGISTRY:-${CI_HARBOR_REGISTRY:-}}"
          user="${SECRET_USER:-${CI_HARBOR_GHA_USER:-}}"
          token="${SECRET_TOKEN:-${CI_HARBOR_GHA_TOKEN:-}}"
          if [ -z "$registry" ] || [ -z "$user" ] || [ -z "$token" ]; then
            echo "CI_HARBOR_REGISTRY, CI_HARBOR_GHA_USER, and CI_HARBOR_GHA_TOKEN are required" >&2
            exit 1
          fi
          if [ "$user" = "harbor_registry_user" ]; then
            echo "Refusing to use Harbor internal registry credentials for CI publication" >&2
            exit 1
          fi
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          build_date="$(./hack/source-date.sh "$source_date_epoch")"
          image_tag="ci-$(date -u '+%Y%m%d%H%M%S')-${GITHUB_SHA::7}"
          chart_version="0.3.0-test.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.g${GITHUB_SHA::7}"
          printf '%s' "$token" | docker login "$registry" --username "$user" --password-stdin
          printf '%s' "$token" | helm registry login "$registry" --username "$user" --password-stdin
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"

      - name: Build and push test operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.TARGET_PLATFORM }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.registry }}/${{ env.HARBOR_PROJECT }}/${{ env.HARBOR_REPOSITORY_PREFIX }}/operator:${{ steps.meta.outputs.image_tag }}
          labels: |
            com.fluxseer.ci.image-tag=${{ steps.meta.outputs.image_tag }}
            com.fluxseer.ci.branch=test
            com.fluxseer.ci.run-id=${{ github.run_id }}
            com.fluxseer.ci.run-attempt=${{ github.run_attempt }}
          build-args: |
            VERSION=test
            GIT_COMMIT=${{ github.sha }}
            GIT_DIRTY=false
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.source_date_epoch }}

      - name: Package and push test Helm chart
        shell: bash
        run: |
          set -euo pipefail
          chart_ref="oci://${{ steps.meta.outputs.registry }}/${HARBOR_PROJECT}/${HARBOR_REPOSITORY_PREFIX}/charts"
          mkdir -p "dist/test-${GITHUB_SHA::7}"
          helm lint charts/fluxseer-rca
          helm package charts/fluxseer-rca \
            --version "${{ steps.meta.outputs.chart_version }}" \
            --app-version "${{ steps.meta.outputs.image_tag }}" \
            --destination "dist/test-${GITHUB_SHA::7}"
          helm push "dist/test-${GITHUB_SHA::7}/${CHART_NAME}-${{ steps.meta.outputs.chart_version }}.tgz" "$chart_ref" 2>&1 | tee helm-push.txt
          helm_digest="$(sed -nE 's/.*Digest:[[:space:]]*(sha256:[[:xdigit:]]+).*/\1/p' helm-push.txt | tail -n1)"
          if [ -z "$helm_digest" ]; then
            echo "failed to parse Helm chart digest from helm push output" >&2
            cat helm-push.txt >&2
            exit 1
          fi
          echo "HELM_DIGEST=$helm_digest" >> "$GITHUB_ENV"

      - name: Write test artifact summary
        run: |
          {
            echo "### FluxSeer RCA test artifacts"
            echo "- Operator image: ${{ steps.meta.outputs.registry }}/${HARBOR_PROJECT}/${HARBOR_REPOSITORY_PREFIX}/operator:${{ steps.meta.outputs.image_tag }}"
            echo "- Helm chart: oci://${{ steps.meta.outputs.registry }}/${HARBOR_PROJECT}/${HARBOR_REPOSITORY_PREFIX}/charts/${CHART_NAME} --version ${{ steps.meta.outputs.chart_version }}"
            echo "- Helm digest: ${HELM_DIGEST}"
            echo "- Branch: test"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-main-image:
    name: Publish Main Artifacts
    runs-on: ubuntu-latest
    needs: [verify, image-identity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      OCI_REGISTRY: ghcr.io
      OCI_REPOSITORY_NAME: fluxseer-rca
      CHART_NAME: fluxseer-rca
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tool in make; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing+=("$tool")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""
            if command -v sudo >/dev/null 2>&1; then
              sudo_cmd="sudo"
            fi
            $sudo_cmd apt-get update
            $sudo_cmd apt-get install -y "${missing[@]}"
          else
            echo "Missing required tools: ${missing[*]}" >&2
            echo "Install them in the self-hosted runner image or add an installer for this OS." >&2
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Resolve main artifact metadata
        id: meta
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          registry="${OCI_REGISTRY}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository_prefix="$owner/${OCI_REPOSITORY_NAME}"
          image_tag="main-${GITHUB_SHA::7}"
          chart_version="0.3.0-main.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.g${GITHUB_SHA::7}"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          build_date="$(./hack/source-date.sh "$source_date_epoch")"
          printf '%s' "$GHCR_TOKEN" | docker login "$registry" --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GHCR_TOKEN" | helm registry login "$registry" --username "$GITHUB_ACTOR" --password-stdin
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "repository_prefix=$repository_prefix" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"

      - name: Build and push main operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.TARGET_PLATFORM }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.registry }}/${{ steps.meta.outputs.repository_prefix }}/operator:${{ steps.meta.outputs.image_tag }}
          labels: |
            com.fluxseer.ci.image-tag=${{ steps.meta.outputs.image_tag }}
            com.fluxseer.ci.branch=main
            com.fluxseer.ci.run-id=${{ github.run_id }}
            com.fluxseer.ci.run-attempt=${{ github.run_attempt }}
          build-args: |
            VERSION=main
            GIT_COMMIT=${{ github.sha }}
            GIT_DIRTY=false
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.source_date_epoch }}

      - name: Package and push main Helm chart
        shell: bash
        run: |
          set -euo pipefail
          chart_ref="oci://${{ steps.meta.outputs.registry }}/${{ steps.meta.outputs.repository_prefix }}/charts"
          mkdir -p "dist/main-${GITHUB_SHA::7}"
          helm lint charts/fluxseer-rca
          helm package charts/fluxseer-rca \
            --version "${{ steps.meta.outputs.chart_version }}" \
            --app-version "${{ steps.meta.outputs.image_tag }}" \
            --destination "dist/main-${GITHUB_SHA::7}"
          helm push "dist/main-${GITHUB_SHA::7}/${CHART_NAME}-${{ steps.meta.outputs.chart_version }}.tgz" "$chart_ref" 2>&1 | tee helm-push.txt
          helm_digest="$(sed -nE 's/.*Digest:[[:space:]]*(sha256:[[:xdigit:]]+).*/\1/p' helm-push.txt | tail -n1)"
          if [ -z "$helm_digest" ]; then
            echo "failed to parse Helm chart digest from helm push output" >&2
            cat helm-push.txt >&2
            exit 1
          fi
          echo "HELM_DIGEST=$helm_digest" >> "$GITHUB_ENV"

      - name: Write main artifact summary
        run: |
          {
            echo "### FluxSeer RCA main artifacts"
            echo "- Operator image: ${{ steps.meta.outputs.registry }}/${{ steps.meta.outputs.repository_prefix }}/operator:${{ steps.meta.outputs.image_tag }}"
            echo "- Helm chart: oci://${{ steps.meta.outputs.registry }}/${{ steps.meta.outputs.repository_prefix }}/charts/${CHART_NAME} --version ${{ steps.meta.outputs.chart_version }}"
            echo "- Helm digest: ${HELM_DIGEST}"
            echo "- Branch: main"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
