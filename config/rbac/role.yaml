apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluxseer-rca-manager-role
rules:
  - apiGroups: [""]
    resources: ["events", "pods", "namespaces", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aiops.platform"]
    resources: ["datasources", "investigationrequests", "modelproviders", "riskrules"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aiops.platform"]
    resources: ["investigationrequests", "risksignals"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["aiops.platform"]
    resources: ["datasources/status", "investigationrequests/status", "modelproviders/status", "riskrules/status", "risksignals/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["aiops.platform"]
    resources: ["remediationplans", "agentactions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["aiops.platform"]
    resources: ["remediationplans/status", "agentactions/status"]
    verbs: ["get", "update", "patch"]
