name: FluxSeer RCA Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable artifact version to publish"
        required: true
        default: "v0.4.0-beta.3"
        type: string
      source_ref:
        description: "Exact commit or ref to publish; required for candidates"
        required: false
        default: ""
        type: string
      candidate:
        description: "Publish a pre-release candidate without creating a GitHub Release"
        required: false
        default: false
        type: boolean
      create_github_release:
        description: "Create the GitHub prerelease and upload release assets"
        required: false
        default: true
        type: boolean
      release_only:
        description: "Skip immutable artifact publication and create the GitHub release from existing artifacts"
        required: false
        default: false
        type: boolean
      qualification_run_id:
        description: "Completed release-qualification workflow run ID for final releases"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: fluxseer-rca-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  TARGET_PLATFORM: linux/amd64
  OCI_REGISTRY: ghcr.io
  OCI_REPOSITORY_NAME: fluxseer-rca
  CHART_NAME: fluxseer-rca

jobs:
  publish:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            source_ref="${{ inputs.source_ref }}"
            candidate="${{ inputs.candidate }}"
            qualification_run_id="${{ inputs.qualification_run_id }}"
            if [ "$candidate" = "true" ]; then
              if [ -z "$source_ref" ]; then
                echo "source_ref is required for candidate publication" >&2
                exit 1
              fi
              if [[ ! "$source_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "candidate source_ref must be a full commit SHA: $source_ref" >&2
                exit 1
              fi
              if [[ ! "$version" =~ -rc\. ]]; then
                echo "candidate version must contain -rc.: $version" >&2
                exit 1
              fi
            elif [ -z "$source_ref" ]; then
              source_ref="$version"
            fi
          else
            version="${GITHUB_REF_NAME}"
            source_ref="$version"
            candidate="false"
            qualification_run_id=""
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "chart_version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "qualification_run_id=$qualification_run_id" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          fetch-depth: 0

      - name: Install runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tool in make jq gh; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing+=("$tool")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""
            if command -v sudo >/dev/null 2>&1; then
              sudo_cmd="sudo"
            fi
            $sudo_cmd apt-get update
            $sudo_cmd apt-get install -y "${missing[@]}"
          else
            echo "Missing required tools: ${missing[*]}" >&2
            echo "Install them in the self-hosted runner image or add an installer for this OS." >&2
            exit 1
          fi

      - name: Verify tag checkout
        id: git
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          source_ref="${{ steps.release.outputs.source_ref }}"
          candidate="${{ steps.release.outputs.candidate }}"
          source_commit="$(git rev-parse "${source_ref}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$source_commit" != "$head_commit" ]; then
            echo "Source ref $source_ref resolves to $source_commit but HEAD is $head_commit" >&2
            exit 1
          fi
          if [ "$candidate" != "true" ]; then
            tag_ref="refs/tags/$version"
            if ! git show-ref --verify --quiet "$tag_ref" || [ "$(git cat-file -t "$tag_ref")" != "tag" ]; then
              echo "final release source must be an annotated tag: $version" >&2
              exit 1
            fi
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "Release checkout must be clean" >&2
            exit 1
          fi
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          build_date="$(./hack/source-date.sh "$source_date_epoch")"
          echo "git_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"

      - name: Verify qualified candidate evidence
        if: ${{ steps.release.outputs.candidate != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALIFICATION_RUN_ID: ${{ steps.release.outputs.qualification_run_id }}
          RELEASE_SOURCE_COMMIT: ${{ steps.git.outputs.git_commit }}
        run: |
          set -euo pipefail
          run_id="${QUALIFICATION_RUN_ID}"
          source_commit="${RELEASE_SOURCE_COMMIT}"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "final release requires a completed qualification workflow run ID" >&2
            exit 1
          fi

          run_json="$(gh run view "$run_id" --json status,conclusion,workflowName)"
          test "$(jq -r '.status' <<<"$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.workflowName' <<<"$run_json")" = "FluxSeer RCA Release Qualification"

          qualification_dir="dist/qualification-$run_id"
          mkdir -p "$qualification_dir"
          gh run download "$run_id" --dir "$qualification_dir"
          report="$(find "$qualification_dir" -type f -name qualification.json -print -quit)"
          if [ -z "$report" ]; then
            echo "qualification workflow artifact does not contain qualification.json" >&2
            exit 1
          fi

          jq -e \
            --arg source_commit "$source_commit" \
            '(.schemaVersion == "fluxseer-release-qualification/v1") and
             (.result == "PASS") and
             (.candidate == true) and
             (.sourceCommit == $source_commit) and
             (.evidence.anonymousPull == true) and
             (.gates.source == "PASS") and
             (.gates.candidatePublication == "PASS") and
             (.gates.anonymousDistribution == "PASS") and
             (.gates.defaultCleanRoom == "PASS") and
             (.gates.experimentalCleanRoom == "PASS") and
             (.gates.artifactIntegrity == "PASS") and
             (.gates.cleanup == "PASS") and
             (.artifacts.operator.digest | strings | test("^sha256:")) and
             (.artifacts.demoObservability.digest | strings | test("^sha256:")) and
             (.artifacts.chart.digest | strings | test("^sha256:"))' \
            "$report"

          cp "$report" dist/qualified-candidate.json
          echo "qualified candidate evidence accepted: $report"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        id: registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          registry="${OCI_REGISTRY}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository_prefix="$owner/${OCI_REPOSITORY_NAME}"
          if [ -z "$GHCR_TOKEN" ]; then
            echo "GitHub token is required for GHCR release publication" >&2
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" | docker login "$registry" --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GHCR_TOKEN" | helm registry login "$registry" --username "$GITHUB_ACTOR" --password-stdin
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "repository_prefix=$repository_prefix" >> "$GITHUB_OUTPUT"

      - name: Verify release-managed packaging
        shell: bash
        run: |
          make verify-packaging-consistency \
            VERSION="${{ steps.release.outputs.version }}" \
            VERIFY_SOURCE_CHART_METADATA=false \
            IMAGE_TAG="${{ steps.release.outputs.version }}" \
            TARGET_PLATFORM="${TARGET_PLATFORM}" \
            IMAGE_REPOSITORY="${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.repository_prefix }}/operator" \
            DEMO_IMAGE_REPOSITORY="${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.repository_prefix }}/demo-observability"

      - name: Check immutable image tags do not exist
        if: ${{ !inputs.release_only }}
        shell: bash
        run: |
          set -euo pipefail
          registry="${{ steps.registry.outputs.registry }}"
          repository_prefix="${{ steps.registry.outputs.repository_prefix }}"
          version="${{ steps.release.outputs.version }}"
          for image in operator demo-observability; do
            ref="$registry/$repository_prefix/$image:$version"
            if docker buildx imagetools inspect "$ref" >/tmp/existing-image.txt 2>&1; then
              echo "Refusing to overwrite existing image tag: $ref" >&2
              cat /tmp/existing-image.txt >&2
              exit 1
            fi
            if ! grep -qi 'not found' /tmp/existing-image.txt; then
              echo "Could not prove image tag is absent: $ref" >&2
              cat /tmp/existing-image.txt >&2
              exit 1
            fi
          done

      - name: Build and push operator image
        id: operator
        if: ${{ !inputs.release_only }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.TARGET_PLATFORM }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.repository_prefix }}/operator:${{ steps.release.outputs.version }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            GIT_COMMIT=${{ steps.git.outputs.git_commit }}
            GIT_DIRTY=false
            BUILD_DATE=${{ steps.git.outputs.build_date }}
            SOURCE_DATE_EPOCH=${{ steps.git.outputs.source_date_epoch }}

      - name: Build and push demo-observability image
        id: demo
        if: ${{ !inputs.release_only }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/fake-observability/Dockerfile
          platforms: ${{ env.TARGET_PLATFORM }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.repository_prefix }}/demo-observability:${{ steps.release.outputs.version }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            GIT_COMMIT=${{ steps.git.outputs.git_commit }}
            GIT_DIRTY=false
            BUILD_DATE=${{ steps.git.outputs.build_date }}
            SOURCE_DATE_EPOCH=${{ steps.git.outputs.source_date_epoch }}

      - name: Verify published image metadata
        id: published
        shell: bash
        run: |
          set -euo pipefail
          registry="${{ steps.registry.outputs.registry }}"
          repository_prefix="${{ steps.registry.outputs.repository_prefix }}"
          version="${{ steps.release.outputs.version }}"
          git_commit="${{ steps.git.outputs.git_commit }}"
          build_date="${{ steps.git.outputs.build_date }}"

          verify_image() {
            image="$1"
            binary="$2"
            title="$3"
            ref="$registry/$repository_prefix/$image:$version"
            docker pull --platform "${TARGET_PLATFORM}" "$ref" >&2
            json="$(docker run --rm --platform "${TARGET_PLATFORM}" --entrypoint "$binary" "$ref" version --output=json)"
            test "$(jq -r '.version' <<<"$json")" = "$version"
            test "$(jq -r '.gitCommit' <<<"$json")" = "$git_commit"
            test "$(jq -r '.gitDirty' <<<"$json")" = "false"
            test "$(jq -r '.buildDate' <<<"$json")" = "$build_date"
            test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')" = "$title"
            test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$version"
            test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$git_commit"
            test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.created" }}')" = "$build_date"
            docker buildx imagetools inspect "$ref" | awk '/Digest:/ {print $2; exit}'
          }

          operator_digest="$(verify_image operator /fluxseer-rca-operator FluxSeer RCA)"
          demo_digest="$(verify_image demo-observability /demo-observability 'FluxSeer RCA Demo Observability')"
          echo "operator_digest=$operator_digest" >> "$GITHUB_OUTPUT"
          echo "demo_digest=$demo_digest" >> "$GITHUB_OUTPUT"

      - name: Package Helm chart
        id: chart
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          chart_version="${{ steps.release.outputs.chart_version }}"
          mkdir -p "dist/release-$version"
          helm lint charts/fluxseer-rca
          helm package charts/fluxseer-rca \
            --version "$chart_version" \
            --app-version "$version" \
            --destination "dist/release-$version"
          package="dist/release-$version/${CHART_NAME}-$chart_version.tgz"
          package_abs="$PWD/$package"
          shasum -a 256 "$package" | sed "s#  dist/release-$version/#  #" > "dist/release-$version/SHA256SUMS"
          package_sha="$(cut -d' ' -f1 "dist/release-$version/SHA256SUMS")"
          helm show chart "$package"
          cd "dist/release-$version"
          shasum -a 256 -c SHA256SUMS
          echo "package=$package_abs" >> "$GITHUB_OUTPUT"
          echo "sha256=$package_sha" >> "$GITHUB_OUTPUT"

      - name: Check immutable Helm chart tag does not exist
        if: ${{ !inputs.release_only }}
        shell: bash
        run: |
          set -euo pipefail
          chart_version="${{ steps.release.outputs.chart_version }}"
          chart_ref="oci://${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.repository_prefix }}/charts/${CHART_NAME}"
          if helm show chart "$chart_ref" --version "$chart_version" >/tmp/existing-chart.txt 2>&1; then
            echo "Refusing to overwrite existing Helm chart: $chart_ref:$chart_version" >&2
            cat /tmp/existing-chart.txt >&2
            exit 1
          fi

      - name: Push Helm OCI chart
        id: helm-push
        if: ${{ !inputs.release_only }}
        shell: bash
        run: |
          set -euo pipefail
          chart_ref="oci://${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.repository_prefix }}/charts"
          helm push "${{ steps.chart.outputs.package }}" "$chart_ref" 2>&1 | tee helm-push.txt
          helm_digest="$(sed -nE 's/.*Digest:[[:space:]]*(sha256:[[:xdigit:]]+).*/\1/p' helm-push.txt | tail -n1)"
          if [ -z "$helm_digest" ]; then
            echo "failed to parse Helm chart digest from helm push output" >&2
            cat helm-push.txt >&2
            exit 1
          fi
          echo "helm_digest=$helm_digest" >> "$GITHUB_OUTPUT"
          helm show chart "$chart_ref/${CHART_NAME}" --version "${{ steps.release.outputs.chart_version }}"

      - name: Resolve existing Helm chart metadata
        id: existing-chart
        if: ${{ inputs.release_only }}
        shell: bash
        run: |
          set -euo pipefail
          chart_ref="oci://${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.repository_prefix }}/charts"
          chart_version="${{ steps.release.outputs.chart_version }}"
          metadata_file="$(mktemp)"
          trap 'rm -f "$metadata_file"' EXIT
          helm show chart "$chart_ref/${CHART_NAME}" --version "$chart_version" 2>&1 | tee "$metadata_file" >/dev/null
          helm_digest="$(sed -nE 's/.*Digest:[[:space:]]*(sha256:[[:xdigit:]]+).*/\1/p' "$metadata_file" | tail -n1)"
          if [ -z "$helm_digest" ]; then
            echo "failed to resolve existing Helm chart digest" >&2
            cat "$metadata_file" >&2
            exit 1
          fi
          echo "helm_digest=$helm_digest" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          chart_version="${{ steps.release.outputs.chart_version }}"
          out_dir="dist/release-$version"
          cat >"$out_dir/RELEASE_NOTES.md" <<EOF
          # FluxSeer RCA $version

          FluxSeer RCA $version is a verifiable RCA and guarded remediation beta release.

          ## Source

          - Tag: $version
          - Tag type: annotated
          - Commit: ${{ steps.git.outputs.git_commit }}

          ## Published Images

          - ${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.repository_prefix }}/operator:$version
            - ${{ steps.published.outputs.operator_digest }}
          - ${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.repository_prefix }}/demo-observability:$version
            - ${{ steps.published.outputs.demo_digest }}
          ## Helm Package

          - ${CHART_NAME}-$chart_version.tgz
          - SHA256: ${{ steps.chart.outputs.sha256 }}
          - OCI digest: ${{ steps.helm-push.outputs.helm_digest || steps.existing-chart.outputs.helm_digest }}

          ## Provenance

          Binary metadata, OCI labels, Helm appVersion, and the annotated source tag all resolve to:

          \`\`\`text
          ${{ steps.git.outputs.git_commit }}
          \`\`\`

          ## Scope

          This release includes the verifiable RCA vertical slice, guarded remediation approval lifecycle, optional Phase 3 Policy Pack evaluation, RiskRule-driven RiskSignal generation, ad-hoc InvestigationRequest workflows, datasource degradation conditions, hosted provider validation, lifecycle smoke coverage, artifact identity, packaging consistency, and reproducible local image builds.

          Policy Pack and autonomous remediation remain opt-in and are not enabled by default for this beta.
          EOF
          sed -i 's/^          //' "$out_dir/RELEASE_NOTES.md"
          echo "notes=$out_dir/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease and upload assets
        if: ${{ github.event_name == 'push' || (inputs.create_github_release && steps.release.outputs.candidate != 'true') }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = '${{ steps.release.outputs.version }}';
            const target = '${{ steps.git.outputs.git_commit }}';
            const chartPackage = '${{ steps.chart.outputs.package }}';
            const releaseDir = path.dirname(chartPackage);
            const notesPath = '${{ steps.notes.outputs.notes }}';
            const body = fs.readFileSync(notesPath, 'utf8');

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = existing.data;
              if (!release.prerelease || release.draft) {
                throw new Error(`Existing release ${tag} is not a published prerelease.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: target,
                name: `FluxSeer RCA ${tag}`,
                body,
                draft: false,
                prerelease: true,
              });
              release = created.data;
            }

            if (release.target_commitish !== target) {
              throw new Error(`Release target mismatch: expected ${target}, got ${release.target_commitish}`);
            }

            const assets = [
              chartPackage,
              path.join(releaseDir, 'SHA256SUMS'),
              notesPath,
            ];

            const listed = await github.rest.repos.listReleaseAssets({
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            const existingNames = new Set(listed.data.map(asset => asset.name));

            for (const assetPath of assets) {
              const name = path.basename(assetPath);
              if (existingNames.has(name)) {
                throw new Error(`Refusing to overwrite existing release asset: ${name}`);
              }
              const data = fs.readFileSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  'content-type': name.endsWith('.tgz') ? 'application/gzip' : 'text/plain',
                  'content-length': data.length,
                },
              });
            }

      - name: Write release summary
        shell: bash
        run: |
          {
            echo "### FluxSeer RCA ${{ steps.release.outputs.version }} Published"
            echo "- Source commit: ${{ steps.git.outputs.git_commit }}"
            echo "- Operator digest: ${{ steps.published.outputs.operator_digest }}"
            echo "- Demo digest: ${{ steps.published.outputs.demo_digest }}"
            echo "- Helm OCI digest: ${{ steps.helm-push.outputs.helm_digest || steps.existing-chart.outputs.helm_digest }}"
            echo "- Helm package SHA256: ${{ steps.chart.outputs.sha256 }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always() && steps.registry.outputs.registry != ''
        run: |
          docker logout "${{ steps.registry.outputs.registry }}" || true
          helm registry logout "${{ steps.registry.outputs.registry }}" || true
