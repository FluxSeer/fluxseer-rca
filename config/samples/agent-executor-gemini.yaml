apiVersion: aiops.platform/v1alpha1
kind: AgentExecutor
metadata:
  name: gemini-cli
spec:
  type: gemini-cli
  image: fluxagent/agent-executor-gemini:dev
  imagePullSecrets: []
  command:
    - /fluxagent-agent-executor
  args:
    - --type=gemini-cli
    - --command=gemini
    - --arg=-p
    - --arg=--json
    - --prompt-arg
  credentialEnvName: GEMINI_API_KEY
  credentialSecretRef:
    name: gemini-secret
    key: api-key
  serviceAccountName: fluxagent-investigator
  timeoutSeconds: 900
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  maxToolCalls: 40
