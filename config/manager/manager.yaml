apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxagent-controller-manager
  namespace: fluxagent-system
  labels:
    app.kubernetes.io/name: fluxagent
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxagent
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxagent
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: fluxagent-controller-manager
      containers:
        - name: manager
          image: fluxagent/operator:latest
          imagePullPolicy: IfNotPresent
          command:
            - /fluxagent-operator
          args:
            - --leader-elect
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
