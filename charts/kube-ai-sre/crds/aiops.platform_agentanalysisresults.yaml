apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentanalysisresults.aiops.platform
spec:
  group: aiops.platform
  scope: Namespaced
  names:
    plural: agentanalysisresults
    singular: agentanalysisresult
    kind: AgentAnalysisResult
    shortNames:
      - aresult
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["sourceRef", "executorRef", "executionKey"]
              properties:
                sourceRef:
                  type: object
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                executorRef:
                  type: object
                  properties:
                    name:
                      type: string
                executionKey:
                  type: string
                ttlSeconds:
                  type: integer
                  format: int64
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                updatedAt:
                  type: string
                  format: date-time
                jobRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                summary:
                  type: string
                rootCause:
                  type: string
                confidence:
                  type: number
                validationSteps:
                  type: array
                  items:
                    type: string
                recommendations:
                  type: array
                  items:
                    type: string
                missingEvidence:
                  type: array
                  items:
                    type: string
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
