name: FluxSeer RCA Release Qualification

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable candidate version, for example v0.5.0-alpha.2-rc.<sha>"
        required: true
        type: string
      source_ref:
        description: "Exact full source commit SHA to qualify"
        required: true
        type: string
      publish_candidate:
        description: "Dispatch and wait for the candidate publication workflow"
        required: false
        default: true
        type: boolean
      run_rca:
        description: "Run the default read-only representative RCA clean-room"
        required: false
        default: true
        type: boolean
      run_remediation:
        description: "Run the experimental rolloutRestart Effective clean-room"
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read
  packages: read

concurrency:
  group: fluxseer-rca-release-qualification-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify Candidate Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ inputs.source_ref }}
      PUBLISH_CANDIDATE: ${{ inputs.publish_candidate }}
      RUN_RCA: ${{ inputs.run_rca }}
      RUN_REMEDIATION: ${{ inputs.run_remediation }}
      RELEASE_QUALIFICATION_ARTIFACT_ROOT: ${{ github.workspace }}/reports/release-qualification/${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install kind and jq
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64"
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          kind version
          jq --version

      - name: Run release qualification orchestrator
        shell: bash
        run: bash hack/release-qualification-orchestrator.sh

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-qualification-${{ inputs.version }}
          path: reports/release-qualification/${{ inputs.version }}
          if-no-files-found: error
