{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "fluxseer-rca.fullname" . }}-workqueue
  namespace: {{ default .Release.Namespace .Values.metrics.prometheusRule.namespace }}
  labels:
    {{- include "fluxseer-rca.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: fluxseer-rca.workqueue
      rules:
        - record: fluxseer_rca_queue_depth
          expr: {{ .Values.metrics.prometheusRule.workqueueDepthExpr | quote }}
{{- end }}
