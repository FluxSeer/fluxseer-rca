apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: investigationrequests.aiops.platform
spec:
  group: aiops.platform
  scope: Namespaced
  names:
    plural: investigationrequests
    singular: investigationrequest
    kind: InvestigationRequest
    shortNames:
      - ireq
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["target"]
              properties:
                target:
                  type: object
                  properties:
                    cluster:
                      type: string
                    namespace:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    apiVersion:
                      type: string
                    service:
                      type: string
                timeRange:
                  type: object
                  properties:
                    lookback:
                      type: string
                question:
                  type: string
                dataSources:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                queries:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      datasourceRef:
                        type: object
                        properties:
                          name:
                            type: string
                      queryType:
                        type: string
                      query:
                        type: string
                      queryTemplate:
                        type: string
                      reasons:
                        type: array
                        items:
                          type: string
                modelProviderRef:
                  type: object
                  properties:
                    name:
                      type: string
                mode:
                  type: string
                createRiskSignal:
                  type: boolean
                loopPolicy:
                  type: object
                  properties:
                    maxDepth:
                      type: integer
                      format: int32
                    allowRiskSignalSource:
                      type: boolean
                ttlSeconds:
                  type: integer
                  format: int64
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                updatedAt:
                  type: string
                  format: date-time
                outcome:
                  type: string
                failure:
                  type: object
                  properties:
                    code:
                      type: string
                    message:
                      type: string
                    stage:
                      type: string
                    retryable:
                      type: boolean
                summary:
                  type: string
                hypothesis:
                  type: string
                confidence:
                  type: number
                provider:
                  type: string
                verdict:
                  type: object
                  properties:
                    outcome:
                      type: string
                    summary:
                      type: string
                    rootCauseEntity:
                      type: object
                      properties:
                        cluster:
                          type: string
                        namespace:
                          type: string
                        kind:
                          type: string
                        name:
                          type: string
                        apiVersion:
                          type: string
                        service:
                          type: string
                    rootCauseType:
                      type: string
                    confidence:
                      type: number
                    confidenceDetail:
                      type: object
                      properties:
                        providerScore:
                          type: number
                        verifiedScore:
                          type: number
                        level:
                          type: string
                        method:
                          type: string
                claims:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      statement:
                        type: string
                      evidenceRefs:
                        type: array
                        items:
                          type: string
                      verification:
                        type: string
                alternativeHypotheses:
                  type: array
                  items:
                    type: object
                    properties:
                      statement:
                        type: string
                      disposition:
                        type: string
                      evidenceRefs:
                        type: array
                        items:
                          type: string
                missingEvidence:
                  type: array
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                      reason:
                        type: string
                degradation:
                  type: object
                  properties:
                    partial:
                      type: boolean
                    unavailableSources:
                      type: array
                      items:
                        type: string
                    reasons:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                          stage:
                            type: string
                          sourceRef:
                            type: object
                            properties:
                              name:
                                type: string
                              namespace:
                                type: string
                          message:
                            type: string
                execution:
                  type: object
                  properties:
                    id:
                      type: string
                    state:
                      type: string
                    provider:
                      type: string
                    providerRef:
                      type: object
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                    providerGeneration:
                      type: integer
                      format: int64
                    providerType:
                      type: string
                    model:
                      type: string
                    rcaSchemaVersion:
                      type: string
                    canonicalizationVersion:
                      type: string
                    reasoningPolicyVersion:
                      type: string
                    controllerVersion:
                      type: string
                    attemptCount:
                      type: integer
                      format: int32
                    attempts:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          providerRequestID:
                            type: string
                          idempotencyKey:
                            type: string
                          retryReason:
                            type: string
                          result:
                            type: string
                          startedAt:
                            type: string
                            format: date-time
                          completedAt:
                            type: string
                            format: date-time
                    durationSeconds:
                      type: integer
                      format: int64
                    inputTokens:
                      type: integer
                      format: int64
                    outputTokens:
                      type: integer
                      format: int64
                    providerResult:
                      type: object
                      properties:
                        schemaVersion:
                          type: string
                        digest:
                          type: object
                          properties:
                            algorithm:
                              type: string
                            canonicalization:
                              type: string
                            value:
                              type: string
                        normalizedResult:
                          type: object
                          properties:
                            riskTitle:
                              type: string
                            riskSummary:
                              type: string
                            severity:
                              type: string
                            confidenceScore:
                              type: integer
                              format: int32
                            confidenceReason:
                              type: string
                            evidenceCoverage:
                              type: string
                            rcaHypothesis:
                              type: string
                            rcaCauses:
                              type: array
                              items:
                                type: string
                            rcaEvidence:
                              type: array
                              items:
                                type: string
                            actionType:
                              type: string
                            actionDescription:
                              type: string
                            actionParameters:
                              type: object
                              additionalProperties:
                                type: string
                            rollbackPlan:
                              type: array
                              items:
                                type: string
                            runbookRefs:
                              type: array
                              items:
                                type: string
                            serviceDocs:
                              type: array
                              items:
                                type: string
                            provider:
                              type: string
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                evidenceRefs:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      kind:
                        type: string
                      source:
                        type: string
                      summary:
                        type: string
                      query:
                        type: string
                      queryDigest:
                        type: string
                      contentDigest:
                        type: string
                      digestAlgorithm:
                        type: string
                      digestCanonicalization:
                        type: string
                      redactionProfile:
                        type: string
                      truncated:
                        type: boolean
                      originalCount:
                        type: integer
                        format: int32
                      retainedCount:
                        type: integer
                        format: int32
                      originalBytes:
                        type: integer
                        format: int32
                      retainedBytes:
                        type: integer
                        format: int32
                      collectedAt:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      link:
                        type: string
                lineage:
                  type: object
                  properties:
                    source:
                      type: object
                      properties:
                        apiVersion:
                          type: string
                        kind:
                          type: string
                        namespace:
                          type: string
                        name:
                          type: string
                        uid:
                          type: string
                        generation:
                          type: integer
                          format: int64
                    targetUID:
                      type: string
                    findingFingerprint:
                      type: string
                    findingIdentity:
                      type: object
                      properties:
                        schemaVersion:
                          type: string
                        objectFindingIdentity:
                          type: string
                        logicalFindingIdentity:
                          type: string
                        incidentOccurrence:
                          type: string
                        findingType:
                          type: string
                        targetGeneration:
                          type: integer
                          format: int64
                        windowBucket:
                          type: string
                    investigationDepth:
                      type: integer
                      format: int32
                linkedRiskSignalRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
