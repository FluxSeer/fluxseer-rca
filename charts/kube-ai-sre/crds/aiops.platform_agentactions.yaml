apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentactions.aiops.platform
spec:
  group: aiops.platform
  scope: Namespaced
  names:
    plural: agentactions
    singular: agentaction
    kind: AgentAction
    shortNames:
      - aact
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["target", "actionType"]
              properties:
                target:
                  type: object
                  properties:
                    cluster: {type: string}
                    namespace: {type: string}
                    kind: {type: string}
                    name: {type: string}
                    apiVersion: {type: string}
                    service: {type: string}
                actionType: {type: string}
                parameters:
                  type: object
                  additionalProperties:
                    type: string
                approvedBy: {type: string}
                dryRunResult: {type: string}
                ttlSeconds: {type: integer, format: int64}
                rollbackPlan:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                observedGeneration: {type: integer, format: int64}
                updatedAt: {type: string, format: date-time}
      subresources:
        status: {}
