apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datasources.aiops.platform
spec:
  group: aiops.platform
  scope: Namespaced
  names:
    plural: datasources
    singular: datasource
    kind: DataSource
    shortNames:
      - dsrc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["type"]
              properties:
                type:
                  type: string
                endpoint:
                  type: string
                timeout:
                  type: string
                networkPolicy:
                  type: object
                  properties:
                    allowedHosts:
                      type: array
                      items:
                        type: string
                    allowedCIDRs:
                      type: array
                      items:
                        type: string
                    deniedCIDRs:
                      type: array
                      items:
                        type: string
                queryPolicy:
                  type: object
                  properties:
                    mode:
                      type: string
                    allowedTemplates:
                      type: array
                      items:
                        type: string
                    maxRange:
                      type: string
                    allowRegexMatchers:
                      type: boolean
                    requireTargetScope:
                      type: boolean
                auth:
                  type: object
                  properties:
                    type:
                      type: string
                    secretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                tls:
                  type: object
                  properties:
                    insecureSkipVerify:
                      type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                updatedAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
