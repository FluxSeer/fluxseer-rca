apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxseer-rca-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fluxseer-rca.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fluxseer-rca.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fluxseer-rca.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "fluxseer-rca.serviceAccountName" . }}
      containers:
        - name: manager
          image: {{ include "fluxseer-rca.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /fluxseer-rca-operator
          args:
            - --metrics-bind-address={{ .Values.controller.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.controller.healthProbeBindAddress }}
            - --leader-elect={{ .Values.controller.enableLeaderElection }}
            - --enable-remediation={{ or .Values.controller.enableRemediation .Values.features.remediation.enabled }}
            - --enable-legacy-deployment-risk={{ or .Values.controller.enableLegacyDeploymentRisk .Values.features.legacyDeploymentRisk.enabled }}
            {{- range .Values.controller.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.controller.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
