apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: riskrules.aiops.platform
spec:
  group: aiops.platform
  scope: Namespaced
  names:
    plural: riskrules
    singular: riskrule
    kind: RiskRule
    shortNames:
      - rrule
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["targetSelector"]
              properties:
                targetSelector:
                  type: object
                  properties:
                    namespaceSelector:
                      type: object
                      properties:
                        matchNames:
                          type: array
                          items:
                            type: string
                    workloadSelector:
                      type: object
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        kinds:
                          type: array
                          items:
                            type: string
                interval:
                  type: string
                window:
                  type: string
                severity:
                  type: string
                signals:
                  type: array
                  items:
                    type: object
                    required: ["name"]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                      datasourceRef:
                        type: object
                        properties:
                          name:
                            type: string
                      queryType:
                        type: string
                      query:
                        type: string
                      queryTemplate:
                        type: string
                      reasons:
                        type: array
                        items:
                          type: string
                      threshold:
                        type: object
                        properties:
                          operator:
                            type: string
                          value:
                            type: number
                notification:
                  type: object
                  properties:
                    webhookRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                ai:
                  type: object
                  properties:
                    rcaEnabled:
                      type: boolean
                    providerRef:
                      type: object
                      properties:
                        name:
                          type: string
                investigationPolicy:
                  type: object
                  properties:
                    mode:
                      type: string
                    createRiskSignal:
                      type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                updatedAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                coverage:
                  type: object
                  properties:
                    supportedTargetKinds:
                      type: array
                      items:
                        type: string
                    unsupportedDiscoveredKinds:
                      type: object
                      additionalProperties:
                        type: integer
                        format: int32
                    partial:
                      type: boolean
      subresources:
        status: {}
