    #   datasourceRef:
    #     name: prometheus
    #   severity: warning
    #   interval: 2m
    #   window: 10m
    #   providerRef:
    #     name: ""
    #   signals:
    #     requestRate:
    #       enabled: true
    #       queryTemplate: |
    #         sum(rate(http_requests_total{namespace="{{ .namespace }}",app="{{ .app }}"}[5m]))
    #       threshold:
    #         operator: ">"
    #         value: 100
    #     errorRate:
    #       enabled: true
    #       queryTemplate: |
    #         sum(rate(http_requests_total{namespace="{{ .namespace }}",app="{{ .app }}",status=~"5.."}[5m]))
