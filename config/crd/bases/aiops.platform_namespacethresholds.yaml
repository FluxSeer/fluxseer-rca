apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: namespacethresholds.aiops.platform
spec:
  group: aiops.platform
  scope: Cluster
  names:
    plural: namespacethresholds
    singular: namespacethreshold
    kind: NamespaceThreshold
    categories:
      - fluxseer
      - policies
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                namespaceSelector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      items:
                        type: object
                        properties:
                          key: {type: string}
                          operator: {type: string}
                          values:
                            type: array
                            items:
                              type: string
                activePlansLimit:
                  type: integer
                  minimum: 0
                  default: 100
                pendingApprovalsLimit:
                  type: integer
                  minimum: 0
                  default: 50
                defaultTTLSeconds:
                  type: integer
                  format: int64
                  minimum: 0
                defaultApprovalTimeoutSeconds:
                  type: integer
                  format: int64
                  minimum: 0
                protectionLevel:
                  type: string
                  enum: ["standard", "strict", "permissive"]
                  default: "standard"
                priority:
                  type: integer
                  minimum: 0
                  default: 0
                enabled:
                  type: boolean
                  default: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Valid", "Invalid", "Disabled"]
                  default: "Pending"
                enforcedNamespaces:
                  type: array
                  items:
                    type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}
                updatedAt: {type: string, format: date-time}
                validationErrors:
                  type: array
                  items:
                    type: string
                lastAppliedGeneration: {type: integer, format: int64}
                totalEnforcedCount:
                  type: integer
                  minimum: 0
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Protection Level
          type: string
          jsonPath: .spec.protectionLevel
        - name: Priority
          type: integer
          jsonPath: .spec.priority
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
