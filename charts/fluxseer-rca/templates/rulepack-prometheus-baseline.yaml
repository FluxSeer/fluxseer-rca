{{- if .Values.rulePacks.prometheusBaseline.enabled }}
apiVersion: aiops.platform/v1alpha1
kind: RiskRule
metadata:
  name: fluxseer-rca-prometheus-baseline
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fluxseer-rca.labels" . | nindent 4 }}
    app.kubernetes.io/component: rule-pack
    aiops.platform/rule-pack: prometheus-baseline
  annotations:
    aiops.platform/rule-pack.description: "Prometheus baseline for common workload metric symptoms"
spec:
  {{- include "fluxseer-rca.rulePackTargetSelector" (dict "root" . "selector" .Values.rulePacks.defaultTargetSelector) | nindent 2 }}
  interval: {{ .Values.rulePacks.prometheusBaseline.interval | quote }}
  window: {{ .Values.rulePacks.prometheusBaseline.window | quote }}
  severity: {{ .Values.rulePacks.prometheusBaseline.severity | quote }}
  signals:
    - name: high-error-rate
      datasourceRef:
        name: {{ .Values.rulePacks.prometheusBaseline.datasourceRef.name | quote }}
      queryType: metric
      queryTemplate: |
        sum(rate(http_requests_total{namespace="{{ "{{ .namespace }}" }}",app="{{ "{{ .app }}" }}",status=~"5.."}[5m]))
      threshold:
        operator: ">"
        value: 0
    - name: request-rate-surge
      datasourceRef:
        name: {{ .Values.rulePacks.prometheusBaseline.datasourceRef.name | quote }}
      queryType: metric
      queryTemplate: |
        (
          sum(rate(http_requests_total{namespace="{{ "{{ .namespace }}" }}",app="{{ "{{ .app }}" }}"}[5m]))
          /
          clamp_min(sum(rate(http_requests_total{namespace="{{ "{{ .namespace }}" }}",app="{{ "{{ .app }}" }}"}[5m] offset {{ .Values.rulePacks.prometheusBaseline.trafficAnomaly.comparisonOffset }})), {{ .Values.rulePacks.prometheusBaseline.trafficAnomaly.baselineEpsilon }})
        )
        *
        (
          sum(rate(http_requests_total{namespace="{{ "{{ .namespace }}" }}",app="{{ "{{ .app }}" }}"}[5m]))
          > bool {{ .Values.rulePacks.prometheusBaseline.trafficAnomaly.minimumCurrentRate }}
        )
        *
        (
          sum(rate(http_requests_total{namespace="{{ "{{ .namespace }}" }}",app="{{ "{{ .app }}" }}"}[5m] offset {{ .Values.rulePacks.prometheusBaseline.trafficAnomaly.comparisonOffset }}))
          > bool {{ .Values.rulePacks.prometheusBaseline.trafficAnomaly.baselineEpsilon }}
        )
      threshold:
        operator: ">"
        value: {{ .Values.rulePacks.prometheusBaseline.trafficAnomaly.increaseRatio }}
    - name: high-latency
      datasourceRef:
        name: {{ .Values.rulePacks.prometheusBaseline.datasourceRef.name | quote }}
      queryType: metric
      queryTemplate: |
        histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace="{{ "{{ .namespace }}" }}",app="{{ "{{ .app }}" }}"}[5m])) by (le))
      threshold:
        operator: ">"
        value: 1
    - name: pod-restart-rate
      datasourceRef:
        name: {{ .Values.rulePacks.prometheusBaseline.datasourceRef.name | quote }}
      queryType: metric
      queryTemplate: |
        sum(rate(kube_pod_container_status_restarts_total{namespace="{{ "{{ .namespace }}" }}",pod=~"{{ "{{ .name }}" }}.*"}[5m]))
      threshold:
        operator: ">"
        value: 0
    - name: cpu-saturation
      datasourceRef:
        name: {{ .Values.rulePacks.prometheusBaseline.datasourceRef.name | quote }}
      queryType: metric
      queryTemplate: |
        sum(rate(container_cpu_usage_seconds_total{namespace="{{ "{{ .namespace }}" }}",pod=~"{{ "{{ .name }}" }}.*"}[5m]))
      threshold:
        operator: ">"
        value: {{ .Values.rulePacks.prometheusBaseline.resourceThresholds.cpuUsageCores }}
    - name: cpu-throttling
      datasourceRef:
        name: {{ .Values.rulePacks.prometheusBaseline.datasourceRef.name | quote }}
      queryType: metric
      queryTemplate: |
        sum(rate(container_cpu_cfs_throttled_periods_total{namespace="{{ "{{ .namespace }}" }}",pod=~"{{ "{{ .name }}" }}.*"}[5m]))
        /
        clamp_min(sum(rate(container_cpu_cfs_periods_total{namespace="{{ "{{ .namespace }}" }}",pod=~"{{ "{{ .name }}" }}.*"}[5m])), 1)
      threshold:
        operator: ">"
        value: {{ .Values.rulePacks.prometheusBaseline.resourceThresholds.cpuThrottlingRatio }}
    - name: memory-saturation
      datasourceRef:
        name: {{ .Values.rulePacks.prometheusBaseline.datasourceRef.name | quote }}
      queryType: metric
      queryTemplate: |
        sum(container_memory_working_set_bytes{namespace="{{ "{{ .namespace }}" }}",pod=~"{{ "{{ .name }}" }}.*"})
      threshold:
        operator: ">"
        value: {{ .Values.rulePacks.prometheusBaseline.resourceThresholds.memoryWorkingSetBytes }}
    - name: memory-near-limit
      datasourceRef:
        name: {{ .Values.rulePacks.prometheusBaseline.datasourceRef.name | quote }}
      queryType: metric
      queryTemplate: |
        sum(container_memory_working_set_bytes{namespace="{{ "{{ .namespace }}" }}",pod=~"{{ "{{ .name }}" }}.*"})
        /
        clamp_min(sum(kube_pod_container_resource_limits{namespace="{{ "{{ .namespace }}" }}",pod=~"{{ "{{ .name }}" }}.*",resource="memory"}), 1)
      threshold:
        operator: ">"
        value: {{ .Values.rulePacks.prometheusBaseline.resourceThresholds.memoryNearLimitRatio }}
  ai:
    rcaEnabled: {{ .Values.rulePacks.prometheusBaseline.rcaEnabled }}
    {{- if .Values.rulePacks.prometheusBaseline.providerRef.name }}
    providerRef:
      name: {{ .Values.rulePacks.prometheusBaseline.providerRef.name | quote }}
    {{- end }}
  investigationPolicy:
    mode: CreateRequest
    createRiskSignal: true
{{- end }}
