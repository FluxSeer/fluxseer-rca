apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxseer-rca-controller-manager
  namespace: fluxseer-rca-system
  labels:
    app.kubernetes.io/name: fluxseer-rca
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxseer-rca
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxseer-rca
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: fluxseer-rca-controller-manager
      containers:
        - name: manager
          image: ghcr.io/fluxseer/fluxseer-rca/operator:v0.4.0-beta.3
          imagePullPolicy: IfNotPresent
          command:
            - /fluxseer-rca-operator
          args:
            - --leader-elect
            - --enable-remediation=false
            - --enable-legacy-deployment-risk=false
            - --enable-policy-pack=false
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
