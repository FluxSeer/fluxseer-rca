apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: risksignals.aiops.platform
spec:
  group: aiops.platform
  scope: Namespaced
  names:
    plural: risksignals
    singular: risksignal
    kind: RiskSignal
    shortNames:
      - rsig
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["target", "signalType", "severity", "confidence"]
              properties:
                target:
                  type: object
                  properties:
                    cluster: {type: string}
                    namespace: {type: string}
                    kind: {type: string}
                    name: {type: string}
                    apiVersion: {type: string}
                    service: {type: string}
                signalType: {type: string}
                findingIdentity:
                  type: object
                  properties:
                    schemaVersion: {type: string}
                    objectFindingIdentity: {type: string}
                    logicalFindingIdentity: {type: string}
                    incidentOccurrence: {type: string}
                    findingType: {type: string}
                    targetGeneration: {type: integer, format: int64}
                    windowBucket: {type: string}
                investigationRef:
                  type: object
                  properties:
                    name: {type: string}
                    namespace: {type: string}
                actionType: {type: string}
                severity: {type: string}
                confidence: {type: integer}
                dryRun: {type: boolean}
                ttlSeconds: {type: integer, format: int64}
                evidence:
                  type: array
                  items:
                    type: object
                    properties:
                      id: {type: string}
                      kind: {type: string}
                      source: {type: string}
                      summary: {type: string}
                      query: {type: string}
                      queryDigest: {type: string}
                      contentDigest: {type: string}
                      digestAlgorithm: {type: string}
                      digestCanonicalization: {type: string}
                      redactionProfile: {type: string}
                      classification:
                        type: object
                        properties:
                          level: {type: string}
                          sensitivityTags:
                            type: array
                            items:
                              type: string
                          source: {type: string}
                          policyVersion: {type: string}
                      truncated: {type: boolean}
                      truncationReason: {type: string}
                      limitDimension: {type: string}
                      limit: {type: integer, format: int64}
                      originalCount: {type: integer, format: int32}
                      retainedCount: {type: integer, format: int32}
                      originalBytes: {type: integer, format: int32}
                      retainedBytes: {type: integer, format: int32}
                      collectedAt: {type: string, format: date-time}
                      reason: {type: string}
                      link: {type: string}
                parameters:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                observedGeneration: {type: integer, format: int64}
                updatedAt: {type: string, format: date-time}
                rcaSummary: {type: string}
                rcaHypothesis: {type: string}
                rcaProvider: {type: string}
                rcaCauses:
                  type: array
                  items:
                    type: object
                    properties:
                      cause: {type: string}
                      confidence: {type: integer}
                projection:
                  type: object
                  properties:
                    mode: {type: string}
                    projectedFrom:
                      type: object
                      properties:
                        name: {type: string}
                        namespace: {type: string}
                    compatibilityPath: {type: boolean}
                    message: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
