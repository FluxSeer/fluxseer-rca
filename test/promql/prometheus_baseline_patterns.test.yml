evaluation_interval: 1m
fuzzy_compare: true

tests:
  - name: prometheus-baseline-pattern-semantics
    interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="pattern-conformance",app="error-high",status="500"}'
        values: '0+60x20'
      - series: 'http_requests_total{namespace="pattern-conformance",app="error-low",status="500"}'
        values: '0+30x20'
      - series: 'http_requests_total{namespace="pattern-conformance",app="error-none",status="500"}'
        values: '0+0x20'
      - series: 'http_requests_total{namespace="pattern-conformance",app="error-no-series",status="200"}'
        values: '0+60x20'
      - series: 'http_request_duration_seconds_bucket{namespace="pattern-conformance",app="latency-high",le="1"}'
        values: '0+90x20'
      - series: 'http_request_duration_seconds_bucket{namespace="pattern-conformance",app="latency-high",le="2"}'
        values: '0+100x20'
      - series: 'http_request_duration_seconds_bucket{namespace="pattern-conformance",app="latency-high",le="+Inf"}'
        values: '0+100x20'
      - series: 'http_request_duration_seconds_bucket{namespace="pattern-conformance",app="latency-normal",le="0.5"}'
        values: '0+95x20'
      - series: 'http_request_duration_seconds_bucket{namespace="pattern-conformance",app="latency-normal",le="1"}'
        values: '0+100x20'
      - series: 'http_request_duration_seconds_bucket{namespace="pattern-conformance",app="latency-normal",le="+Inf"}'
        values: '0+100x20'
      - series: 'http_request_duration_seconds_bucket{namespace="pattern-conformance",app="latency-boundary",le="1"}'
        values: '0+100x20'
      - series: 'http_request_duration_seconds_bucket{namespace="pattern-conformance",app="latency-boundary",le="+Inf"}'
        values: '0+100x20'
    promql_expr_test:
      - expr: |
          sum(rate(http_requests_total{namespace="pattern-conformance",app="error-high",status=~"5.."}[5m]))
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: |
          sum(rate(http_requests_total{namespace="pattern-conformance",app="error-low",status=~"5.."}[5m]))
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 0.5
      - expr: |
          sum(rate(http_requests_total{namespace="pattern-conformance",app="error-none",status=~"5.."}[5m]))
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: |
          sum(rate(http_requests_total{namespace="pattern-conformance",app="error-no-series",status=~"5.."}[5m]))
        eval_time: 10m
        exp_samples: []
      - expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace="pattern-conformance",app="latency-high"}[5m])) by (le))
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1.5
      - expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace="pattern-conformance",app="latency-normal"}[5m])) by (le))
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 0.5
      - expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace="pattern-conformance",app="latency-boundary"}[5m])) by (le))
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 0.95
