image:
  repository: fluxseer/fluxseer-rca/operator
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: fluxseer-rca-controller-manager

controller:
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  enableLeaderElection: false
  enableRemediation: false
  enableLegacyDeploymentRisk: false
  extraArgs: []
  extraEnv: []
  resources: {}

features:
  legacyDeploymentRisk:
    enabled: false
  remediation:
    enabled: false
  experimentalExecutor:
    enabled: false

rbac:
  # Empty means derive the profile from feature flags:
  # readOnlyRCA, remediation, or experimentalExecutor.
  # Set explicitly only as an advanced override.
  profile: ""

metrics:
  prometheusRule:
    enabled: false
    namespace: ""
    labels: {}
    workqueueDepthExpr: "sum by (name) (workqueue_depth)"
  grafanaDashboard:
    enabled: false
    namespace: ""
    labels:
      grafana_dashboard: "1"

modelGateway:
  provider: heuristic

dataSources:
  prometheus:
    enabled: false
    url: ""
  loki:
    enabled: false
    url: ""

rulePacks:
  defaultTargetSelector:
    namespaceSelector: {}
    workloadSelector:
      kinds:
        - Deployment
  kubernetesBaseline:
    enabled: true
    interval: 2m
    window: 10m
    severity: warning
    rcaEnabled: true
    providerRef:
      name: ""
  prometheusBaseline:
    enabled: false
    datasourceRef:
      name: prometheus
    interval: 2m
    window: 10m
    severity: warning
    rcaEnabled: true
    trafficAnomaly:
      comparisonOffset: 30m
      increaseRatio: 3
      minimumCurrentRate: 10
    resourceThresholds:
      cpuUsageCores: 0.8
      cpuThrottlingRatio: 0.2
      memoryWorkingSetBytes: 1073741824
      memoryNearLimitRatio: 0.9
    providerRef:
      name: ""
  lokiBaseline:
    enabled: false
    datasourceRef:
      name: loki
    interval: 2m
    window: 10m
    severity: warning
    rcaEnabled: true
    providerRef:
      name: ""
  applicationProfiles:
    enabled: false
    profiles: []
