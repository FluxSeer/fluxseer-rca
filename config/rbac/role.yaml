apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluxagent-manager-role
rules:
  - apiGroups: [""]
    resources: ["events", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aiops.platform"]
    resources: ["risksignals", "remediationplans", "agentactions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["aiops.platform"]
    resources: ["risksignals/status", "remediationplans/status", "agentactions/status"]
    verbs: ["get", "update", "patch"]
