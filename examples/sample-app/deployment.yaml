apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxseer-rca-sample
  annotations:
    fluxseer-rca.aiops.platform/enabled: "true"
    fluxseer-rca.aiops.platform/prometheus-query: |
      sum(rate(http_requests_total{namespace="fluxseer-rca-demo",app="fluxseer-rca-sample",status=~"5.."}[5m]))
    fluxseer-rca.aiops.platform/prometheus-threshold: "0.2"
    fluxseer-rca.aiops.platform/loki-query: |
      {namespace="fluxseer-rca-demo",app="fluxseer-rca-sample"} |= "error"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluxseer-rca-sample
  template:
    metadata:
      labels:
        app: fluxseer-rca-sample
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:8080
            - -text=fluxseer-rca sample app
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: fluxseer-rca-sample
spec:
  selector:
    app: fluxseer-rca-sample
  ports:
    - name: http
      port: 8080
      targetPort: 8080
