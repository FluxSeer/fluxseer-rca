apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: investigationrequests.aiops.platform
spec:
  group: aiops.platform
  scope: Namespaced
  names:
    plural: investigationrequests
    singular: investigationrequest
    kind: InvestigationRequest
    shortNames:
      - ireq
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["target"]
              properties:
                target:
                  type: object
                  properties:
                    cluster:
                      type: string
                    namespace:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    apiVersion:
                      type: string
                    service:
                      type: string
                timeRange:
                  type: object
                  properties:
                    lookback:
                      type: string
                question:
                  type: string
                dataSources:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                modelProviderRef:
                  type: object
                  properties:
                    name:
                      type: string
                mode:
                  type: string
                createRiskSignal:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                updatedAt:
                  type: string
                  format: date-time
                summary:
                  type: string
                hypothesis:
                  type: string
                confidence:
                  type: number
                provider:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                evidenceRefs:
                  type: array
                  items:
                    type: object
                    properties:
                      kind:
                        type: string
                      source:
                        type: string
                      summary:
                        type: string
                      query:
                        type: string
                      reason:
                        type: string
                      link:
                        type: string
                linkedRiskSignalRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
