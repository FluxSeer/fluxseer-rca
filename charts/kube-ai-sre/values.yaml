image:
  repository: fluxagent/operator
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: fluxagent-controller-manager

controller:
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  enableLeaderElection: false
  enableRemediation: false
  extraArgs: []
  extraEnv: []
  resources: {}

metrics:
  prometheusRule:
    enabled: false
    namespace: ""
    labels: {}
    workqueueDepthExpr: "sum by (name) (workqueue_depth)"
  grafanaDashboard:
    enabled: false
    namespace: ""
    labels:
      grafana_dashboard: "1"

modelGateway:
  provider: heuristic

dataSources:
  prometheus:
    enabled: false
    url: ""
  loki:
    enabled: false
    url: ""

rulePacks:
  defaultTargetSelector:
    namespaceSelector: {}
    workloadSelector:
      kinds:
        - Deployment
  kubernetesBaseline:
    enabled: true
    interval: 2m
    window: 10m
    severity: warning
    rcaEnabled: true
    providerRef:
      name: ""
  prometheusBaseline:
    enabled: false
    datasourceRef:
      name: prometheus
    interval: 2m
    window: 10m
    severity: warning
    rcaEnabled: true
    providerRef:
      name: ""
  lokiBaseline:
    enabled: false
    datasourceRef:
      name: loki
    interval: 2m
    window: 10m
    severity: warning
    rcaEnabled: true
    providerRef:
      name: ""

notification:
  slackWebhookSecretRef: ""
